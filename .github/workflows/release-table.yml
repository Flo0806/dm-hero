name: Release Game Table

# Push to main with a new version (Changesets) -> versioned image + GitHub release.
# Manual run -> test image ":edge" from the current main, no release, no version.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/staging/package.json'
      - 'packages/staging/CHANGELOG.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-table

jobs:
  # Manual run: test build for table.dm-hero.com before the official release
  build-edge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/staging/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          VERSION=$(node -p "require('./packages/staging/package.json').version")
          TAG="table-v$VERSION"

          # 0.0.0 = not released yet (first release is 0.1.0 via Changesets)
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Version 0.0.0 - nothing to release yet"
            echo "should_release=false" >> $GITHUB_OUTPUT
          # Check if this version tag already exists
          elif git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists - skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist - will release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/staging/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Game table version: $VERSION"

  build-and-push:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/staging/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  create-release:
    needs: [check, build-and-push]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read changelog
        id: changelog
        run: |
          if [ -f packages/staging/CHANGELOG.md ]; then
            CHANGELOG=$(sed -n '/^## /,/^## /p' packages/staging/CHANGELOG.md | sed '$ d' | tail -n +2)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: table-v${{ needs.check.outputs.version }}
          name: DM Hero Game Table v${{ needs.check.outputs.version }}
          body: |
            ## Game Table v${{ needs.check.outputs.version }}

            Docker image: `ghcr.io/flo0806/dm-hero-table:${{ needs.check.outputs.version }}`

            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(needs.check.outputs.version, 'alpha') || contains(needs.check.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
